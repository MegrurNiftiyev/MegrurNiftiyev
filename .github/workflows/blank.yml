name: Generate Profile Metrics
on:
  schedule:
    - cron: "0 */12 * * *" # Hər 12 saatdan bir avtomatik işə düşür
  workflow_dispatch: # İstədiyin vaxt əllə başlatmaq üçün
  push:
    branches:
    - main
jobs:
  generate:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 5
    
    steps:
      # 1. Reponu yoxlayır və faylları hazırlamaq üçün mühit yaradır
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. İlan Oyunu Animasiyasını Yaradır
      - name: generate github-contribution-grid-snake.svg
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark
            
      # 4. Yaradılan ilan oyununu avtomatik olaraq gizli 'output' budağına yükləyir
      - name: push files to the output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
